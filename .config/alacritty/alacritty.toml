# ─────Colors──────────────────────────────────────────────────────────────────

# https://github.com/shelepuginivan/dotfiles/blob/main/.config/alacritty/colors.toml
# https://github.com/vanzsh/gruvbox-color-guide/blob/main/gruvbox-theme-color-palette-guide.pdf

[colors.primary]
background = "#212121"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
blue    = "#458588"
cyan    = "#689d6a"
green   = "#98971a"
magenta = "#b16286"
red     = "#cc241d"
white   = "#a89984"
yellow  = "#d79921"

[colors.bright]
black   = "#928374"
blue    = "#83a598"
cyan    = "#8ec07c"
green   = "#b8bb26"
magenta = "#d3869b"
red     = "#fb4934"
white   = "#ebdbb2"
yellow  = "#fabd2f"

# ─────Font────────────────────────────────────────────────────────────────────

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# ─────General─Settings────────────────────────────────────────────────────────

[mouse]
hide_when_typing = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[window]
opacity = 0.9
padding = { x = 10, y = 10 }

# ─────Keyboard─Bindings───────────────────────────────────────────────────────

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "K"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "J"
mods = "Control|Shift"

# ─────Other─Configurations────────────────────────────────────────────────────

